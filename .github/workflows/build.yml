# ============================================================
#  Sync43 — automatic installer builds (free on GitHub)
#
#  How to use:
#   1. Push this repo to GitHub (public repo = unlimited free builds)
#   2. On GitHub: Actions tab → this workflow runs on every push
#      to main, or run it manually with "Run workflow"
#   3. When it finishes (~10 min), open the run → Artifacts →
#      download:
#        sync43-windows  → .exe installer (+ .msi)
#        sync43-linux    → .rpm (+ .deb and .AppImage)
# ============================================================
name: Build installers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: sync43-windows
          - platform: ubuntu-22.04
            artifact: sync43-linux

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build app and installers
        uses: tauri-apps/tauri-action@v0

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
