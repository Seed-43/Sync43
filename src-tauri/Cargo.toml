[package]
name = "sync43"
version = "0.1.0"
description = "Sync43 — Construction Data Sync by Seed43"
authors = ["Seed43"]
edition = "2021"

[lib]
name = "sync43_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

# Stage 3 (P2P) will add:
# iroh = "..."        # endpoint + relay
# iroh-blobs = "..."  # content-addressed file transfer
# blake3 = "1"        # manifest fingerprinting
# ed25519-dalek = "2" # identity + manifest signatures
